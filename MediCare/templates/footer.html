<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Footer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 30px 15px;
            margin-top: 30px;
        }

        footer h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        footer p {
            margin: 10px 0;
        }

        .footer-links {
            margin: 15px 0;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
        }

        .footer-links a:hover {
            color: cyan;
        }

        footer hr {
            border: 0;
            border-top: 1px solid #64748b;
            margin: 20px 0;
        }

        .copyright {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <footer>
        <h3>My Website</h3>

        <p>Welcome to our website!</p>

        <div class="footer-links">
            <a href="/">login</a>
            <a href="/Home/">Home</a>
        </div>

        <hr>

        <p class="copyright">
            &copy; 2026 My Website. All Rights Reserved.
        </p>
    </footer>

</body>
</html>
